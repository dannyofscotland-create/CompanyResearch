[project]
name = "companyresearch"
version = "0.1.0"
description = "Public-source company research briefings. Not investment advice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
    "yfinance>=0.2.40",
]

[project.scripts]
companyresearch = "companyresearch.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
companyresearch = ["static/*"]
