name: Free pretend helper watch

on:
  schedule:
    # Every 30 minutes — free GitHub Actions. PC can be off.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pretend-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Restore pretend wallet
        uses: actions/cache@v4
        with:
          path: .cache
          key: pretend-wallet-${{ github.run_id }}
          restore-keys: |
            pretend-wallet-

      - name: Helper pass
        env:
          COMPANYRESEARCH_DATA: .cache
        run: python -m companyresearch --autopilot --scoreboard site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
